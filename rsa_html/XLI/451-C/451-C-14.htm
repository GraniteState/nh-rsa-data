<center><h1>TITLE XLI<br>LIENS</h1></center>
<center><h2>CHAPTER 451-C<br>SELF-SERVICE STORAGE FACILITY LIENS</h2></center>
<center><h3>Section 451-C:14</h3></center>
&nbsp;&nbsp;&nbsp;<b> 451-C:14 Liability. &#150;</b>
<codesect>
An owner acting in accordance with the provisions of this chapter shall not be liable to the renter, lienholder, or any other person.
</codesect>
<sourcenote>
<p><b>Source.</b> 2019, 242:1, eff. Oct. 10, 2019.
</p>
</sourcenote>
