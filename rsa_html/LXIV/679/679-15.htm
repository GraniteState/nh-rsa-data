<center><h1>TITLE LXIV<br>PLANNING AND ZONING</h1></center>
<center><h2>CHAPTER 679<br>HOUSING APPEALS BOARD</h2></center>
<center><h3>Section 679:15</h3></center>
&nbsp;&nbsp;&nbsp;<b> 679:15 Appeal. &#150;</b>
<codesect>
Decisions of the board may be appealed to the supreme court by any party in accordance with the provisions of RSA 541 as from time to time amended.
</codesect>

<p><b>Source.</b> 2019, 346:260, eff. July 1, 2020.
