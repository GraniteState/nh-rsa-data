<center><h1>TITLE LXIV<br>PLANNING AND ZONING</h1></center>
<center><h2>CHAPTER 679<br>HOUSING APPEALS BOARD</h2></center>
<center><h3>Section 679:14</h3></center>
&nbsp;&nbsp;&nbsp;<b> 679:14 Notice. &#150;</b>
<codesect>
The board shall serve notice in writing of the time, place, and cause of any hearing upon all parties at least 20 days prior to the date of the hearing.
</codesect>
<sourcenote>
<p><b>Source.</b> 2019, 346:260, eff. July 1, 2020.
</p>
</sourcenote>
