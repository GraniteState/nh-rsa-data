<center><h1>TITLE LXIV<br>PLANNING AND ZONING</h1></center>
<center><h2>CHAPTER 679<br>HOUSING APPEALS BOARD</h2></center>
<center><h3>Section 679:17</h3></center>
&nbsp;&nbsp;&nbsp;<b> 679:17 Staff. &#150;</b>
<codesect>
The board shall have such clerical, administrative, and technical staff as may be necessary within the limits of the appropriation made therefor.
</codesect>

<p><b>Source.</b> 2019, 346:260, eff. July 1, 2020.
