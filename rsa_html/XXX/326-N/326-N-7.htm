<center><h1>TITLE XXX<br>OCCUPATIONS AND PROFESSIONS</h1></center>
<center><h2>CHAPTER 326-N<br>COMMUNITY HEALTH WORKERS</h2></center>
<center><h3>Section 326-N:7</h3></center>
&nbsp;&nbsp;&nbsp;<b> 326-N:7 Telemedicine. &#150;</b>
<codesect>
Certified community health workers shall be permitted to provide services through the use of telemedicine.
</codesect>
<sourcenote>
<p><b>Source.</b> 2024, 289:6, eff. Jan. 1, 2025.
</p>
</sourcenote>
