<center><h1>TITLE XLIII<br>DOMESTIC RELATIONS</h1></center>
<center><h2>CHAPTER 461-B<br>EMANCIPATION</h2></center>
<center><h3>Section 461-B:5</h3></center>
&nbsp;&nbsp;&nbsp;<b> 461-B:5 Burden of Proof. &#150;</b>
<codesect>
The petitioner has the burden to prove the allegations in support of the petition by clear and convincing evidence.
</codesect>
<sourcenote>
<p><b>Source.</b> 2019, 110:1, eff. Jan. 1, 2020.
</p>
</sourcenote>
