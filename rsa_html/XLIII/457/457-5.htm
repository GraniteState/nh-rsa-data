<center><h1>TITLE XLIII<br>DOMESTIC RELATIONS</h1></center>
<center><h2>CHAPTER 457<br>MARRIAGES</h2></center>
<center><h2>Age</h2></center>
<center><h3>Section 457:5</h3></center>
&nbsp;&nbsp;&nbsp;<b> 457:5 Of Consent. &#150;</b>
<codesect>
The age of consent shall be in the male and in the female, 18 years.
</codesect>
<sourcenote>
<p><b>Source.</b> 1907, 80:2. 1923, 108:1. PL 286:5. RL 338:5. RSA 457:5. 1973, 72:35, eff. June 3, 1973. 2024, 81:2, eff. Jan. 1, 2025.
</p>
