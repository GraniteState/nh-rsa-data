<center><h1>TITLE XV<br>EDUCATION</h1></center>
<center><h2>CHAPTER 194-E<br>INNOVATION SCHOOLS</h2></center>
<center><h3>Section 194-E:8</h3></center>
&nbsp;&nbsp;&nbsp;<b> 194-E:8 Rulemaking. &#150;</b>
<codesect>
The state board of education shall adopt rules, pursuant to RSA 541-A, relative to innovation schools and innovation zones.
</codesect>
