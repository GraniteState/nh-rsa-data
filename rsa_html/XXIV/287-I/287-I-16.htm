<center><h1>TITLE XXIV<br>GAMES, AMUSEMENTS, AND ATHLETIC EXHIBITIONS</h1></center>
<center><h2>CHAPTER 287-I<br>SPORTS BETTING</h2></center>
<center><h3>Section 287-I:16</h3></center>
&nbsp;&nbsp;&nbsp;<b> 287-I:16 Fantasy Sports Exempted. &#150;</b>
<codesect>
Nothing in this chapter shall apply to fantasy sports contests authorized pursuant to RSA 287-H.
</codesect>
<sourcenote>
<p><b>Source.</b> 2019, 215:1, eff. July 12, 2019.
</p>
