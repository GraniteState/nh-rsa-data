<center><h3>Section 259:100-aa</h3></center>
&nbsp;&nbsp;&nbsp;<b> 259:100-aa Signature. &#150;</b>
<codesect>
"Signature" means a written signature, or an electronic signature as defined in RSA 294-E:2 and when authorized by the director.
</codesect>

<p><b>Source.</b> 2026, 63:2, eff. July 7, 2026.
