<center><h1>TITLE LXIII<br>ELECTIONS</h1></center>
<center><h2>CHAPTER 652<br>GENERAL PROVISIONS</h2></center>
<center><h2>Terms and Definitions</h2></center>
<center><h3>Section 652:16-f</h3></center>
&nbsp;&nbsp;&nbsp;<b> 652:16-f Deliberative Session. &#150;</b>
<codesect>
"Deliberative session" means the first session of a meeting in a town that has adopted the provisions of RSA 40:13.
</codesect>
<sourcenote>
<p><b>Source.</b> 2019, 192:4, eff. July 10, 2019.
</p>
