<center><h1>TITLE I<br>THE STATE AND ITS GOVERNMENT</h1></center>
<center><h2>CHAPTER 21<br>STATUTORY CONSTRUCTION</h2></center>
<center><h3>Section 21:55</h3></center>
&nbsp;&nbsp;&nbsp;<b> 21:55 Clean Energy. &#150;</b>
<codesect>
"Clean energy" means minimal to no greenhouse gas emitting sources, including nuclear and other renewable sources.
</codesect>
<sourcenote>
<p><b>Source.</b> 2025, 169:1, eff. Sept. 13, 2025.
</p>
