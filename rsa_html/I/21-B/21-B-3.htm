<center><h2>CHAPTER 21-B<br>COMMON LAW RULE ABROGATED</h2></center>
<center><h3>Section 21-B:3</h3></center>
&nbsp;&nbsp;&nbsp;<b> 21-B:3 Emancipation by Marriage. &#150;</b>
<codesect>
The certificate of marriage shall provide evidence of a minor's emancipation.
</codesect>
<sourcenote>
<p><b>Source.</b> 2018, 297:1, eff. Jan. 1, 2019.
