<center><h1>TITLE I<br>THE STATE AND ITS GOVERNMENT</h1></center>
<center><h2>CHAPTER 3<br>STATE EMBLEMS, FLAG, ETC.</h2></center>
<center><h3>Section 3:30</h3></center>
&nbsp;&nbsp;&nbsp;<b> 3:30 State Raptor. &#150;</b>
<codesect>
The red-tailed hawk, Buteo jamaicensis, is hereby designated as the state raptor of New Hampshire.
</codesect>
<sourcenote>
<p><b>Source.</b> 2019, 73:1, eff. June 14, 2019.
</p>
</sourcenote>
