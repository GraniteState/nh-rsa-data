<center><h1>TITLE I<br>THE STATE AND ITS GOVERNMENT</h1></center>
<center><h2>CHAPTER 3<br>STATE EMBLEMS, FLAG, ETC.</h2></center>
<center><h3>Section 3:31</h3></center>
&nbsp;&nbsp;&nbsp;<b> 3:31 State Spider. &#150;</b>
<codesect>
The daring jumping spider (<i>Phidippus audax</i>) is hereby designated as the official state spider of New Hampshire.
</codesect>
<sourcenote>
<p><b>Source.</b> 2021, 75:1, eff. June 11, 2021.
</p>
