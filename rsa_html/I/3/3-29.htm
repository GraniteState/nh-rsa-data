<center><h1>TITLE I<br>THE STATE AND ITS GOVERNMENT</h1></center>
<center><h2>CHAPTER 3<br>STATE EMBLEMS, FLAG, ETC.</h2></center>
<center><h3>Section 3:29</h3></center>
&nbsp;&nbsp;&nbsp;<b> 3:29 State Poultry. &#150;</b>
<codesect>
The New Hampshire Red is hereby designated as the official state poultry of New Hampshire.
</codesect>
<sourcenote>
<p><b>Source.</b> 2018, 268:1, eff. June 18, 2018.
